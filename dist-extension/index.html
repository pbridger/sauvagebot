<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deadlands Assistant</title>
    <script type="module" crossorigin src="/assets/main-CmlI9uPt.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/index-Bgmlk7PP.js">
    <link rel="stylesheet" crossorigin href="/assets/main-Uw3O2_jM.css">
  </head>
  <body>
    <nav id="tabs" role="tablist">
      <button id="tab-sheet" role="tab" aria-selected="true">Sheet</button>
      <button id="tab-initiative" role="tab" aria-selected="false">Initiative</button>
    </nav>

    <div id="notice" hidden></div>

    <!-- Inside the tab area: none of it means anything on the Initiative tab. -->
    <header id="bar">
      <select id="who" aria-label="Character"></select>
      <button id="new" title="New character">＋</button>
      <button id="edit" title="Edit this character" aria-pressed="false">Edit</button>
      <button id="import" title="Import an archetype card">Import…</button>
      <button id="export" title="Download the roster as JSON">Export</button>
      <button id="session" title="New session: every Wild Card back to 3 Bennies">Session</button>
      <input id="file" type="file" accept=".html,.htm,.json" multiple hidden />
    </header>

    <main id="sheet">
      <p class="empty">No characters yet. <strong>Import…</strong> an archetype card to start.</p>
    </main>

    <form id="freeform">
      <input
        id="expr"
        type="text"
        placeholder="Anything: s8+2, 2d6+1, 4d6k3, 3#s10…"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit">Roll</button>
      <button id="roll-secret" type="button" title="Roll behind the screen — stays on this machine">
        Secret
      </button>
    </form>

    <section id="log" aria-live="polite"></section>

    <footer><span id="budget"></span><span id="saved"></span></footer>

  </body>
</html>
