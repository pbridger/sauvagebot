<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deadlands dice</title>
    <style>
      /*
        A window-sized, transparent, click-through page. The modal is opened with
        `disablePointerEvents`, so nothing here can steal a click from the map, but
        the page must also not paint over it — hence no background anywhere, on
        `html` and `body` as well as the canvas holder.
      */
      html,
      body,
      #tray,
      #chips {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      #tray canvas {
        display: block;
      }
      /*
        Bennies slid across the table. A sibling of `#tray`, not a child, because
        `teardown` empties the tray with `replaceChildren` when the table goes
        quiet — a chip parented there would vanish mid-flight.

        Stacked over the felt so a chip flicked during a roll passes in front of
        the dice rather than behind them.
      */
      #chips {
        position: absolute;
        inset: 0;
      }
      .chip {
        /*
          Placed at the origin and moved entirely by `transform`, because the
          transform is written every frame by the simulation and a compositor-only
          property is the one thing that can be. `left`/`top` would relayout.
        */
        position: absolute;
        left: 0;
        top: 0;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        /*
          A chip you can see turning.

          The first one was a plain radial gradient — which is *radially symmetric*,
          so it span two and a half revolutions on every throw and there was no way
          on earth to tell. Reported as "no evidence of spin", and quite right.

          Four layers, topmost first. Between them there is a mark with 360°
          period (the index wedge), one with 60° (the rim spots) and one with 360°
          again (the off-centre highlight in the body), so the rotation reads at any
          speed instead of strobing at one.
        */
        background:
          /* the cream centre, which also caps the inner end of the index wedge */
          radial-gradient(circle at 50% 50%, #f7f3e8 0 21%, transparent 22%),
          /* one dark index wedge: a full turn is unmistakable */
          conic-gradient(from 0deg, rgba(58, 12, 8, 0.72) 0 13deg, transparent 13deg),
          /* the field, which clips the rim spots to the rim */
          radial-gradient(circle at 50% 50%, transparent 0 21%, #b8402e 22% 68%, transparent 69%),
          /* six cream edge spots, as on every chip in every casino */
          repeating-conic-gradient(from 15deg, #f7f3e8 0 20deg, transparent 20deg 60deg),
          /* the body, its highlight off-centre so it travels round with the chip */
          radial-gradient(circle at 34% 28%, #e0684f, #8c2f22 72%);
        box-shadow:
          0 3px 9px rgba(0, 0, 0, 0.5),
          inset 0 0 0 2px rgba(247, 243, 232, 0.85),
          inset 0 0 6px rgba(60, 12, 8, 0.55);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="tray"></div>
    <div id="chips"></div>
    <script type="module" src="/src/tray.ts"></script>
  </body>
</html>
