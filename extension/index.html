<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deadlands Assistant</title>
    <link rel="stylesheet" href="/src/panel.css" />
  </head>
  <body>
    <nav id="tabs" role="tablist">
      <button id="tab-sheet" role="tab" aria-selected="true">Sheet</button>
      <button id="tab-initiative" role="tab" aria-selected="false">Initiative</button>
      <button id="tab-table" role="tab" aria-selected="false" hidden>Table</button>
    </nav>

    <div id="notice" hidden></div>

    <!-- Inside the tab area: none of it means anything on the Initiative tab. -->
    <header id="bar">
      <select id="who" aria-label="Character"></select>
      <button id="edit" title="Edit this character" aria-pressed="false">Edit</button>
    </header>
    <input id="file" type="file" accept=".html,.htm,.json" multiple hidden />

    <main id="sheet">
      <p class="empty">No characters yet. <strong>Import…</strong> an archetype card to start.</p>
    </main>

    <form id="freeform">
      <input
        id="expr"
        type="text"
        placeholder="Anything: s8+2, 2d6+1, 4d6k3, 3#s10…"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit">Roll</button>
      <button id="roll-secret" type="button" title="Roll behind the screen — stays on this machine">
        Secret
      </button>
    </form>

    <section id="log" aria-live="polite"></section>

    <footer>
      <!--
        Not in the Table pane with the rest of the settings: that tab is the
        Marshal's, and animation is each player's own choice about their own machine.
      -->
      <button id="anim" type="button" aria-pressed="false">🎲 Dice: off</button>
      <span id="budget"></span><span id="saved"></span>
    </footer>

    <script type="module" src="/src/panel.ts"></script>
  </body>
</html>
