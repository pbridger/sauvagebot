<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deadlands Assistant</title>
    <link rel="stylesheet" href="/src/panel.css" />
  </head>
  <body>
    <header id="bar">
      <select id="who" aria-label="Character"></select>
      <button id="new" title="New character">＋</button>
      <button id="edit" title="Edit this character" aria-pressed="false">Edit</button>
      <button id="import" title="Import an archetype card">Import…</button>
      <button id="export" title="Download the roster as JSON">Export</button>
      <input id="file" type="file" accept=".html,.htm,.json" multiple hidden />
    </header>

    <div id="notice" hidden></div>

    <main id="sheet">
      <p class="empty">No characters yet. <strong>Import…</strong> an archetype card to start.</p>
    </main>

    <form id="freeform">
      <input
        id="expr"
        type="text"
        placeholder="Anything: s8+2, 2d6+1, 4d6k3, 3#s10…"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit">Roll</button>
      <label id="secret-wrap" title="Roll behind the screen — stays on this machine">
        <input id="secret" type="checkbox" />
        <span>Secret</span>
      </label>
    </form>

    <section id="log" aria-live="polite"></section>

    <footer><span id="budget"></span><span id="saved"></span></footer>

    <script type="module" src="/src/panel.ts"></script>
  </body>
</html>
